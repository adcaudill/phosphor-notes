name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**' # Don't trigger on changes to the 'docs' directory, which is built/deployed separately
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

# Cancel superseded runs on the same PR; never cancel runs on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # setup-node's built-in cache only restores on an exact lockfile match, so
      # every dependency bump was a cold install. Fall back to the newest cache
      # for this OS so only changed packages need to be downloaded.
      - name: Get npm cache directory
        id: npm-cache
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: npm test

      # On Ubuntu, the coverage run is the test run (no need to run the suite twice).
      - name: Run tests with coverage (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
