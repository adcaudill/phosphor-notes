name: Build

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**' # Don't trigger on changes to the 'docs' directory, which is built/deployed separately
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'

# Cancel superseded runs on the same PR; never cancel runs on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # setup-node's built-in cache only restores on an exact lockfile match, so
      # every dependency bump was a cold install. Fall back to the newest cache
      # for this OS so only changed packages need to be downloaded.
      - name: Get npm cache directory
        id: npm-cache
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run build (typecheck + vite build)
        run: npm run build

      # Calls electron-builder directly: `npm run build` above already produced ./out,
      # so the build:* scripts would just rebuild it (and re-typecheck, on Windows).
      # PRs produce an unpacked app (--dir), which exercises the packaging config
      # without spending minutes building installers (DMG/ZIP, NSIS, AppImage/snap/deb).
      # Full installers are still built on pushes to main.
      - name: Package app (${{ matrix.platform }})
        shell: bash
        run: npx electron-builder --${{ matrix.platform }} --publish never ${{ github.event_name == 'pull_request' && '--dir' || '' }} || true
